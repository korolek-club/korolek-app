
<!DOCTYPE html>
<html lang="ru">
<head>
<script src="config.js"></script>  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Королёк — управление клубом</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171321;color:#f8f5ff;font:16px Arial,sans-serif}
header{padding:24px 18px;background:#211a2e}
h1{color:#e6b86d;margin:0 0 8px}
h2{font-size:21px;margin:25px 0 14px}
main{max-width:850px;margin:auto;padding:18px}
small,.muted{color:#bdb5c9}
nav{display:flex;gap:8px;overflow:auto;padding:14px 0}
button{border:0;border-radius:10px;padding:12px 15px;font-size:15px;cursor:pointer}
nav button{background:#33283f;color:white;white-space:nowrap}
nav button.active,.primary{background:#e6b86d;color:#211526;font-weight:bold}
.card{background:#2a2337;padding:17px;margin:12px 0;border-radius:16px}
.free{color:#90e6aa}
.busy{color:#f4bc83}
input,select{width:100%;padding:12px;margin:6px 0 12px;background:#fff;color:#222;border:0;border-radius:8px;font-size:16px}
label{display:block;margin-top:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.hidden{display:none}
.danger{background:#69333c;color:#fff}
</style>
</head>
<body>
<header>
<h1>♛ Королёк</h1>
<div class="muted">Управление караоке-клубом</div>
</header>
<main>
<nav>
<button class="active" onclick="tab('rooms',this)">Залы</button>
<button onclick="tab('bookings',this)">Брони</button>
<button onclick="tab('guests',this)">Гости</button>
<button onclick="tab('hookahs',this)">Кальяны</button>
<button onclick="tab('reports',this)">Отчёты</button>
</nav>
<section id="rooms">
<h2>Наши залы</h2>
<div id="roomList"></div>
</section>
<section id="bookings" class="hidden">
<h2>Новое бронирование</h2>
<div class="card">
<label>Зал<select id="room"></select></label>
<label>Имя гостя<input id="name" placeholder="Имя"></label>
<label>Телефон<input id="phone" type="tel" placeholder="+7..."></label>
<label>Дата<input id="date" type="date"></label>
<label>Время<input id="time" type="time"></label>
<label>Часов<input id="hours" type="number" min="1" value="1"></label>
<label>Депозит, ₽<input id="deposit" type="number" value="1000"></label>
<button class="primary" onclick="addBooking()">Сохранить бронь</button>
</div>
<h2>Список бронирований</h2>
<div id="bookingList"></div>
</section>
<section id="guests" class="hidden">
<h2>Гости</h2><div id="guestList"></div>
</section>
<section id="hookahs" class="hidden">
<h2>Добавить кальян</h2>
<div class="card">
<label>Зал<select id="hookahRoom"></select></label>
<label>Количество<input id="hookahCount" type="number" min="1" value="1"></label>
<button class="primary" onclick="addHookah()">Добавить</button>
</div>
<div id="hookahList"></div>
</section>
<section id="reports" class="hidden">
<h2>Отчёт</h2><div id="reportList"></div>
</section>
<p class="muted"><small>Демонстрационная версия. Данные сохраняются только в этом браузере. Не используйте для реальных персональных данных гостей.</small></p>
</main>
<script>
const rooms=[
{name:"Малахит",capacity:10},
{name:"Кобальт",capacity:4},
{name:"Терракота",capacity:4},
{name:"Лиловый",capacity:10},
{name:"Мокко",capacity:12},
{name:"Вишня",capacity:7}
];
let bookings=JSON.parse(localStorage.getItem("korolek_bookings")||"[]");
let hookahs=JSON.parse(localStorage.getItem("korolek_hookahs")||"[]");
const el=id=>document.getElementById(id);
const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){
localStorage.setItem("korolek_bookings",JSON.stringify(bookings));
localStorage.setItem("korolek_hookahs",JSON.stringify(hookahs));
render();
}
function tab(id,btn){
document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));
el(id).classList.remove("hidden");
document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
render();
}
async function addBooking(){
const b={
id:Date.now(),
room:el("room").value,
name:el("name").value.trim(),
phone:el("phone").value.trim(),
date:el("date").value,
time:el("time").value,
hours:Number(el("hours").value),
deposit:Number(el("deposit").value)
};
if(!b.name||!b.phone||!b.date||!b.time||b.hours<1){alert("Заполните все поля");return}
const start=new Date(b.date+"T"+b.time).getTime();
const end=start+b.hours*3600000+15*60000;
const overlap=bookings.some(x=>{
if(x.room!==b.room)return false;
const s=new Date(x.date+"T"+x.time).getTime();
const e=s+x.hours*3600000+15*60000;
return start<e&&end>s;
});
if(overlap){alert("Зал занят в это время с учётом 15 минут на уборку");return}
const saved = await saveBookingToDatabase(b);
if (!saved) return;
bookings.push(b);
el("name").value="";
el("phone").value="";
save();
alert("Бронь сохранена");
}

async function removeBooking(id) {
  if (!confirm("Удалить бронирование?")) return;

  const { error } = await db
    .from("bookings")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Не удалось удалить бронь: " + error.message);
    return;
  }

  bookings = bookings.filter(b => b.id !== id);
  save();
  alert("Бронирование удалено");
}
async function addHookah(){
const count=Number(el("hookahCount").value);
if(!Number.isInteger(count)||count<1){alert("Укажите количество");return}
const room = el("hookahRoom").value;
const roomId = window.roomIds?.[room]; 
if (!roomId) {
  alert("Зал не найден в базе данных");
  return;
}  
const { error } = await db.from("hookah_orders").insert({
  room_id: roomId,
  quantity: count
});
if (error) {
  alert("Не удалось сохранить кальян: " + error.message);
  return;
}  
hookahs.push({id:Date.now(),room:el("hookahRoom").value,count,price:1500*count});
save();
}
function render(){
el("roomList").innerHTML=rooms.map(r=>{
const today=new Date().toLocaleDateString("en-CA");
const active=bookings.some(b=>{
if(b.room!==r.name)return false;
const now=Date.now(),start=new Date(b.date+"T"+b.time).getTime();
return now>=start&&now<start+b.hours*3600000;
});
return `<div class="card row"><div><b>${r.name}</b><br><small>До ${r.capacity} гостей</small></div><span class="${active?"busy":"free"}">${active?"● Занят":"● Свободен"}</span></div>`;
}).join("");
el("bookingList").innerHTML=bookings.length?bookings.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(b=>`<div class="card"><b>${safe(b.room)}</b> — ${safe(b.date)} ${safe(b.time)}<p>${safe(b.name)} · ${safe(b.phone)}</p><small>${b.hours} ч · депозит ${b.deposit} ₽</small><p><button class="danger" onclick="removeBooking(${b.id})">Удалить</button></p></div>`).join(""):"<p class='muted'>Бронирований пока нет</p>";
const guests=[...new Map(bookings.map(b=>[b.phone,b])).values()];
el("guestList").innerHTML=guests.length?guests.map(g=>`<div class="card"><b>${safe(g.name)}</b><br>${safe(g.phone)}</div>`).join(""):"<p class='muted'>Гостей пока нет</p>";
el("hookahList").innerHTML=hookahs.length?hookahs.map(h=>`<div class="card">${safe(h.room)} · ${h.count} шт. · ${h.price} ₽</div>`).join(""):"<p class='muted'>Заказов пока нет</p>";
const total=hookahs.reduce((s,h)=>s+h.price,0);
el("reportList").innerHTML=`<div class="card">Бронирований: <b>${bookings.length}</b></div><div class="card">Гостей: <b>${guests.length}</b></div><div class="card">Кальянов: <b>${hookahs.reduce((s,h)=>s+h.count,0)}</b></div><div class="card">Сумма кальянов: <b>${total} ₽</b></div>`;
}
rooms.forEach(r=>{
el("room").add(new Option(r.name,r.name));
el("hookahRoom").add(new Option(r.name,r.name));
});
el("date").value=new Date().toLocaleDateString("en-CA");
render();
</script>
<script>
const db = window.supabase.createClient(
  window.KOROLEK_CONFIG.supabaseUrl,
  window.KOROLEK_CONFIG.supabaseAnonKey
);
</script>  
<div id="loginBox" class="card" style="max-width:400px;margin:20px auto">
  <h2>Вход для сотрудников</h2>
  <input id="loginEmail" type="email" placeholder="Электронная почта">
  <input id="loginPassword" type="password" placeholder="Пароль">
  <button onclick="loginStaff()">Войти</button>
  <p id="loginMessage"></p>
</div>  
<script>
async function loginStaff() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const message = document.getElementById("loginMessage");

  message.textContent = "Проверяем данные...";

  try {
    const { error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      message.textContent = "Не удалось войти. Проверьте почту и пароль.";
      return;
    }

    message.textContent = "Вход выполнен успешно!";
  } catch (e) {
    message.textContent = "Ошибка подключения. Попробуйте позже.";
  }
}
</script>  
<div id="resetBox" class="card" style="max-width:400px;margin:20px auto;display:none">
  <h2>Установить новый пароль</h2>
  <input id="newPassword" type="password" placeholder="Новый пароль">
  <button onclick="saveNewPassword()">Сохранить пароль</button>
  <p id="resetMessage"></p>
</div>
<script>
db.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    document.getElementById("resetBox").style.display = "block";
    document.getElementById("loginBox").style.display = "none";
  }
});

async function saveNewPassword() {
  const password = document.getElementById("newPassword").value;
  const message = document.getElementById("resetMessage");

  if (password.length < 8) {
    message.textContent = "Пароль должен содержать минимум 8 символов";
    return;
  }

  message.textContent = "Сохраняем пароль...";
  const { error } = await db.auth.updateUser({ password });

  if (error) {
    message.textContent = "Ошибка: " + error.message;
    return;
  }

  document.getElementById("newPassword").value = "";
  message.textContent = "Пароль успешно изменён!";
}
</script>  
<script>
const appContent = document.querySelector("main");
if (appContent) appContent.style.display = "none";  
db.auth.onAuthStateChange((event, session) => {
  if (appContent) appContent.style.display = session ? "" : "none";
});  
</script>
<script>
const loginBox = document.getElementById("loginBox");

const logoutButton = document.createElement("button");
logoutButton.textContent = "Выйти";
logoutButton.style.margin = "20px";
logoutButton.style.display = "none";
logoutButton.onclick = async () => {
  const { error } = await db.auth.signOut();
  if (error) alert("Ошибка выхода: " + error.message);
};
loginBox.insertAdjacentElement("afterend", logoutButton);

db.auth.onAuthStateChange((event, session) => {
  loginBox.style.display = session ? "none" : "";
  logoutButton.style.display = session ? "" : "none";
});
</script>
<script>
async function loadRoomsFromDatabase() {
  const { data, error } = await db
    .from("rooms")
    .select("id, name");

  if (error) {
    console.error("Ошибка загрузки залов:", error.message);
    return;
  }

  window.roomIds = {};
  data.forEach(room => {
    window.roomIds[room.name] = room.id;
  });

  console.log("Залы подключены к базе");
}

db.auth.onAuthStateChange((event, session) => {
  if (session) loadRoomsFromDatabase();
});
</script>  

<script>
async function loadBookingsFromDatabase() {
  const { data, error } = await db
    .from("bookings")
    .select("id, room_id, guest_display_name, start_at, end_at, deposit_amount");

  if (error) {
    console.error("Ошибка загрузки броней:", error);
    return;
  }

  const roomNames = Object.fromEntries(
    Object.entries(window.roomIds || {}).map(
      ([name, id]) => [id, name]
    )
  );

  bookings = (data || []).map(b => ({
    id: b.id,
    room: roomNames[b.room_id] || "Неизвестный зал",
    name: b.guest_display_name || "",
    phone: "",
    date: b.start_at.slice(0, 10),
    time: new Date(b.start_at).toLocaleTimeString("ru-RU", {
      hour: "2-digit",
      minute: "2-digit"
    }),
    hours: (new Date(b.end_at) - new Date(b.start_at)) / 3600000,
    deposit: b.deposit_amount || 0
  }));

  render();
}

db.auth.onAuthStateChange((event, session) => {
  if (session) {
    loadRoomsFromDatabase().then(loadBookingsFromDatabase);
  }
});
</script>  
<script>
async function saveBookingToDatabase(b) {
  const roomId = window.roomIds?.[b.room];

  if (!roomId) {
    alert("Зал не найден в базе данных");
    return false;
  }
const { data: guest, error: guestError } = await db
  .from("guests")
  .insert({
    phone: b.phone,
phone_normalized: b.phone.replace(/\D/g, ""),
first_name: b.name 
  })
  .select("id")
  .single();
  if (guestError || !guest) {
  alert("Ошибка сохранения гостя: " + (guestError?.message || "Гость не создан"));
  return false;
}
  const start = new Date(b.date + "T" + b.time);
  const end = new Date(start.getTime() + b.hours * 3600000);

  const { error } = await db.from("bookings").insert({
  guest_id: guest.id,
room_id: roomId,
    guest_display_name: b.name,
    start_at: start.toISOString(),
    end_at: end.toISOString(),
    deposit_amount: b.deposit
  });

  if (error) {
    alert("Ошибка сохранения брони: " + error.message);
    return false;
  }

  return true;
}
</script>  
</body>
</html>
